# Hourly opportunity discovery. Vercel's free (Hobby) plan only allows
# once-a-day cron jobs, so GitHub Actions triggers the hourly run instead.
# Needs two repository secrets (Settings → Secrets and variables → Actions):
#   APP_URL      e.g. https://hq-yourname.vercel.app  (no trailing slash)
#   CRON_SECRET  the same value as the CRON_SECRET env var on Vercel
name: Hourly opportunity discovery

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Run discovery
        env:
          APP_URL: ${{ secrets.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$APP_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "APP_URL / CRON_SECRET secrets are not set — skipping."
            exit 0
          fi
          curl --fail-with-body --silent --show-error --max-time 300 \
            -H "Authorization: Bearer $CRON_SECRET" \
            "$APP_URL/api/cron/check-all"
